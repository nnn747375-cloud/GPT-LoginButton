name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build library
        run: dotnet build src/GptLoginButton/GptLoginButton.csproj --configuration Release
      - name: Build demo
        run: dotnet build examples/WinFormsDemo/WinFormsDemo.csproj --configuration Release
